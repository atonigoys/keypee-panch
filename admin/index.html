<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEYPEE PANCH - Admin Dashboard</title>
    <link rel="stylesheet" href="../style.css?v=21">
</head>

<body>
    <div id="admin-page-wrapper" style="display: none;">
        <header>
            <div class="logo">KEYPEE PANCH <span
                    style="font-size: 0.8rem; background: var(--color-text-primary); color: var(--color-bg); padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 10px;">ADMIN</span>
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../services.html">Services</a></li>
                    <li><a href="../social.html">Social</a></li>
                    <li><a href="../offer.html">Offer</a></li>
                </ul>
            </nav>
        </header>

        <main id="admin-content">
            <div class="container">
                <h1>Admin Dashboard</h1>

                <!-- Upload Section -->
                <div class="upload-container">
                    <h2 style="margin-bottom: 1.5rem;">Upload New Design</h2>
                    <form id="upload-form" class="upload-form">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="upload-category" required>
                                <option value="" disabled selected>Select Category</option>
                                <option value="Shirt">Shirt</option>
                                <option value="Poloshirt">Poloshirt</option>
                                <option value="Longsleeve">Longsleeve</option>
                                <option value="Sleeveless">Sleeveless</option>
                                <option value="Full Set Jersey">Full Set Jersey</option>

                                <option value="Logo">Logo</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Color</label>
                            <select id="upload-color">
                                <option value="Black">Black</option>
                                <option value="White">White</option>
                                <option value="Blue">Blue</option>
                                <option value="Red">Red</option>
                                <option value="Green">Green</option>
                                <option value="Yellow">Yellow</option>
                                <option value="Orange">Orange</option>
                                <option value="Purple">Purple</option>
                                <option value="Pink">Pink</option>
                                <option value="Cyan">Cyan</option>
                                <option value="Beige">Beige</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Image File</label>
                            <input type="file" id="upload-file" accept="image/*" required>
                        </div>
                        <div class="form-group"
                            style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; margin-bottom: 1rem;">
                            <input type="checkbox" id="upload-featured"
                                style="width: auto; height: 1.2rem; width: 1.2rem; accent-color: var(--color-text-primary);">
                            <label for="upload-featured" style="margin: 0; cursor: pointer;">Show in "Featured
                                Designs"</label>
                        </div>
                        <div>
                            <button type="submit" class="btn" style="width: 100%;">Upload Design</button>
                        </div>
                    </form>
                </div>

                <!-- Recent Uploads Gallery -->
                <div class="gallery-header">
                    <h2 style="margin: 0;">All Images</h2>
                    <div id="gallery-filters" class="admin-filters">
                        <button class="gallery-filter active" data-filter="all"
                            style="padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border: 1px solid var(--color-text-primary); background: var(--color-text-primary); color: var(--color-bg); border-radius: 4px; flex-shrink: 0;">
                            All
                        </button>
                        <button class="gallery-filter" data-filter="featured"
                            style="padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border: 1px solid gold; background: transparent; color: gold; border-radius: 4px; flex-shrink: 0;">
                            ⭐ Featured
                        </button>
                        <button class="gallery-filter" data-filter="cat:Shirt"
                            style="padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border: 1px solid var(--color-text-secondary); background: transparent; color: var(--color-text-secondary); border-radius: 4px; flex-shrink: 0;">
                            Shirt
                        </button>
                        <button class="gallery-filter" data-filter="cat:Poloshirt"
                            style="padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border: 1px solid var(--color-text-secondary); background: transparent; color: var(--color-text-secondary); border-radius: 4px; flex-shrink: 0;">
                            Poloshirt
                        </button>
                        <button class="gallery-filter" data-filter="cat:Longsleeve"
                            style="padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border: 1px solid var(--color-text-secondary); background: transparent; color: var(--color-text-secondary); border-radius: 4px; flex-shrink: 0;">
                            Longsleeve
                        </button>
                        <button class="gallery-filter" data-filter="cat:Sleeveless"
                            style="padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border: 1px solid var(--color-text-secondary); background: transparent; color: var(--color-text-secondary); border-radius: 4px; flex-shrink: 0;">
                            Sleeveless
                        </button>
                        <button class="gallery-filter" data-filter="cat:Full Set Jersey"
                            style="padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border: 1px solid var(--color-text-secondary); background: transparent; color: var(--color-text-secondary); border-radius: 4px; flex-shrink: 0;">
                            Jersey
                        </button>
                        <button class="gallery-filter" data-filter="cat:Logo"
                            style="padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border: 1px solid var(--color-text-secondary); background: transparent; color: var(--color-text-secondary); border-radius: 4px; flex-shrink: 0;">
                            Logo
                        </button>
                    </div>
                    <span id="image-count"
                        style="font-size: 0.8rem; color: var(--color-text-secondary); margin-left: auto;"></span>
                </div>
                <div id="upload-gallery" class="admin-gallery-grid">
                    <p style="grid-column: 1/-1; color: var(--color-text-secondary); font-style: italic;">No images
                        uploaded yet.</p>
                </div>

                <p style="color: var(--color-text-secondary); font-size: 0.85rem; margin-bottom: 2rem;">
                    💡 Gallery list refreshes every 60 seconds from Cloudinary, but your actions are instant.
                </p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 KEYPEE PANCH. All rights reserved.</p>
        </footer>
    </div>

    <script src="../script.js?v=18"></script>
</body>

</html>
