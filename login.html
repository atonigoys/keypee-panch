    <style>
        .login-container {
            width: 100%;
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            color: var(--color-text-primary);
            border-radius: 4px;
        }

        .error-msg {
            color: #ff4444;
            margin-bottom: 1rem;
            display: none;
        }
