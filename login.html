<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEYPEE PANCH - Login</title>
    <link rel="stylesheet" href="style.css?v=5">
    <style>
        .login-container {
            width: 100%;
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            color: var(--color-text-primary);
            border-radius: 4px;
        }

        .error-msg {
            color: #ff4444;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">KEYPEE PANCH</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="social.html">Social</a></li>
                <li><a href="offer.html">Offer</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <h1 style="margin-bottom: 2rem;">Login</h1>
            <div id="error-msg" class="error-msg">Invalid credentials</div>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Sign In</button>
            </form>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 KEYPEE PANCH. All rights reserved.</p>
    </footer>

    <script src="script.js?v=18"></script>
</body>

</html>
